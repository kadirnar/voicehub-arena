[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voicehub-arena"
version = "0.1.0"
description = "Reproducible English TTS benchmarks for every VoiceHub model"
requires-python = ">=3.10"
dependencies = ["voicehub", "numpy", "soundfile", "jiwer>=4", "faster-whisper>=1.2", "huggingface-hub", "fastapi", "uvicorn"]

[project.optional-dependencies]
test = ["pytest", "httpx"]
validation = ["sentencepiece==0.2.1"]
prepare = ["torchaudio>=2.8,<2.9", "onnxruntime", "phonemizer==3.4.0", "num2words==0.5.14"]
linguistic = ["transformers==4.57.6", "g2p-en==2.1.0", "wordsegment==1.3.1", "mecab-python3==1.0.12", "unidic-lite==1.0.8", "pykakasi==2.3.0", "librosa==0.11.0", "nltk==3.10.3"]

[project.scripts]
voicehub-arena = "voicehub_arena.cli:main"

[tool.setuptools.package-data]
voicehub_arena = ["static/*"]

[tool.setuptools.packages.find]
include = ["voicehub_arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
