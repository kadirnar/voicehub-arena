[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voicehub-arena"
version = "0.1.0"
description = "Reproducible English TTS benchmarks for every VoiceHub model"
requires-python = ">=3.12"
dependencies = ["voicehub", "numpy", "soundfile", "jiwer>=4", "faster-whisper>=1.2", "huggingface-hub", "fastapi", "uvicorn", "whisper-normalizer==0.1.12"]

[project.optional-dependencies]
test = ["pytest", "httpx"]
plots = ["matplotlib==3.11.2"]
datasets = ["pyarrow==21.0.0", "gdown==5.2.0", "requests"]
validation = ["sentencepiece==0.2.1", "einops==0.8.1"]
kokoro = ["misaki[en]==0.9.4", "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]
prepare = ["torchaudio>=2.8,<2.9", "onnxruntime", "phonemizer-fork==3.3.2", "num2words==0.5.14"]
xtts = ["coqpit==0.0.17", "pypinyin==0.55.0", "hangul-romanize==0.1.0", "num2words==0.5.14", "spacy>=3.8,<4", "tokenizers>=0.21", "torchaudio>=2.8,<2.9", "librosa==0.11.0"]
linguistic = ["transformers==4.57.6", "g2p-en==2.1.0", "wordsegment==1.3.1", "mecab-python3==1.0.12", "unidic-lite==1.0.8", "pykakasi==2.3.0", "librosa==0.11.0", "nltk==3.10.3"]

[project.scripts]
voicehub-arena = "voicehub_arena.cli:main"

[tool.setuptools.package-data]
voicehub_arena = ["static/*"]

[tool.setuptools.packages.find]
include = ["voicehub_arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
